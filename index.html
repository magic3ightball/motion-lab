<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Motion Lab</title>
<style>
  :root {
    --bg: #0e0f13; --panel: #16181f; --line: #2a2d38; --text: #e8e6e1; --dim: #8b8d98;
    --a: #ff7a59; --b: #5ab8ff; --chip: #20232c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.45 -apple-system, "Apple SD Gothic Neo", system-ui, sans-serif; }
  #app { display: grid; grid-template-columns: 1fr 320px; grid-template-rows: 1fr auto; height: 100vh; }
  #stage { position: relative; min-height: 0; }
  #gl { width: 100%; height: 100%; display: block; }
  .label { position: absolute; top: 12px; font-weight: 700; font-size: 12px; padding: 3px 8px;
    border-radius: 6px; background: #000a; display: none; pointer-events: none; }
  #labA { left: 12px; color: var(--a); }
  #labB { left: calc(50% + 12px); color: var(--b); }
  #app.compare .label { display: block; }

  #bar { display: flex; gap: 12px; align-items: center; padding: 10px 16px;
    border-top: 1px solid var(--line); background: var(--panel); }
  #bar input[type=range] { flex: 1; }
  #time { font-variant-numeric: tabular-nums; color: var(--dim); font-size: 12px; min-width: 96px; text-align: right; }

  #panel { grid-row: 1 / 3; grid-column: 2; background: var(--panel); border-left: 1px solid var(--line);
    padding: 16px; overflow: auto; display: flex; flex-direction: column; gap: 16px; }
  h1 { font-size: 16px; margin: 0; letter-spacing: .02em; }
  h2 { font-size: 12px; margin: 0 0 8px; color: var(--dim); font-weight: 600; display: flex;
    justify-content: space-between; align-items: center; }
  .seg { display: flex; background: var(--chip); border-radius: 8px; padding: 3px; gap: 3px; }
  .seg button { flex: 1; }
  button { background: transparent; color: var(--text); border: 0; border-radius: 6px; padding: 6px 8px;
    font: inherit; font-size: 13px; cursor: pointer; }
  button:hover { background: #ffffff10; }
  button.on { background: #ffffff1c; font-weight: 600; }
  #play { background: var(--chip); width: 40px; }
  .tip { background: #ffffff08; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px;
    font-size: 12.5px; color: #cfcdc8; }
  .tip b { color: var(--text); }
  #curve { width: 100%; height: 230px; background: #0b0c10; border-radius: 8px; display: block;
    touch-action: none; }
  #code { font: 12px ui-monospace, Menlo, monospace; color: var(--dim); margin-top: 6px; user-select: all; }
  .presets { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
  .presets button { background: var(--chip); font-size: 12px; padding: 5px 8px; }
  .presets button.on { outline: 1px solid var(--edit, var(--a)); }
  .row { display: grid; grid-template-columns: 76px 1fr 40px; gap: 8px; align-items: center; font-size: 13px; }
  .row output { color: var(--dim); font-variant-numeric: tabular-nums; text-align: right; font-size: 12px; }
  input[type=range] { accent-color: var(--a); width: 100%; }
  select { background: var(--chip); color: var(--text); border: 1px solid var(--line); border-radius: 6px;
    padding: 5px; font: inherit; font-size: 13px; }
  #tabs { display: none; gap: 4px; }
  #app.compare #tabs { display: flex; }
  #tabs button { padding: 2px 10px; font-size: 12px; }
  #tabs button.on[data-k=A] { color: var(--a); } #tabs button.on[data-k=B] { color: var(--b); }
  .check { display: flex; gap: 8px; align-items: center; cursor: pointer; font-size: 13px; }
  .hidden { display: none !important; }
  #err { position: absolute; inset: 0; display: none; place-items: center; color: var(--dim); padding: 24px; text-align: center; }

  @media (max-width: 760px) {
    #app { grid-template-columns: 1fr; grid-template-rows: 55vh auto auto; height: auto; }
    #panel { grid-row: auto; grid-column: 1; border-left: 0; border-top: 1px solid var(--line); }
  }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="gl"></canvas>
    <div class="label" id="labA">A</div>
    <div class="label" id="labB">B</div>
    <div id="err">이 브라우저는 WebGL2를 지원하지 않아요.</div>
  </div>

  <div id="bar">
    <button id="play" title="재생/정지 (Space)">⏸</button>
    <input id="scrub" type="range" min="0" max="1" step="0.001" value="0">
    <span id="time">0.00s / 0.00s</span>
  </div>

  <aside id="panel">
    <h1>Motion Lab</h1>

    <div>
      <h2>장면</h2>
      <div class="seg" id="scenes">
        <button data-s="0" class="on">① 타일</button>
        <button data-s="1">② 파문</button>
        <button data-s="2">③ 덩어리</button>
      </div>
    </div>

    <div class="tip" id="tip"></div>

    <div>
      <h2><span>이징 커브</span>
        <span id="tabs"><button data-k="A" class="on">A 편집</button><button data-k="B">B 편집</button></span>
      </h2>
      <canvas id="curve"></canvas>
      <div id="code"></div>
      <div class="presets" id="presets"></div>
      <div class="row hidden" id="bounceRow" style="margin-top:10px">
        <span>출렁임</span><input id="bounce" type="range" min="0" max="1" step="0.01"><output id="bounceOut"></output>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;gap:10px">
      <div class="row"><span>지속시간</span><input id="dur" type="range" min="0.2" max="3" step="0.05"><output id="durOut"></output></div>
      <div class="row"><span>스태거</span><input id="stagger" type="range" min="0" max="2" step="0.05"><output id="staggerOut"></output></div>
      <div class="row" id="dirRow"><span>스태거 방향</span>
        <select id="dir"><option value="0">대각선</option><option value="1">중심 → 바깥</option><option value="2">랜덤</option><option value="3">줄 순서</option></select><span></span>
      </div>
      <label class="check"><input type="checkbox" id="compare"> A/B 비교 (화면 반씩 나눠 동시 재생)</label>
    </div>
  </aside>
</div>

<script id="fs" type="x-shader/x-fragment">#version 300 es
precision highp float;
uniform vec2 uRes;
uniform float uT, uDur, uStagger, uPx;
uniform int uScene, uDir, uCycle, uCompare;
uniform sampler2D uEaseA, uEaseB;
out vec4 outColor;

int side = 0;

// 이징 LUT(256칸)에서 값 읽기 — JS와 똑같은 커브를 셰이더에서 씀
float lut(sampler2D s, float t) {
  t = clamp(t, 0., 1.) * 255.;
  int i = int(floor(t));
  int j = min(i + 1, 255);
  return mix(texelFetch(s, ivec2(i, 0), 0).r, texelFetch(s, ivec2(j, 0), 0).r, fract(t));
}
float E(float t) { return side == 0 ? lut(uEaseA, t) : lut(uEaseB, t); }

// delay초 늦게 출발하는 요소의 진행도 0..1
float prog(float delay) { return clamp((uT - delay) / uDur, 0., 1.); }

const vec3 P[5] = vec3[5](vec3(1., .48, .35), vec3(1., .82, .40), vec3(.02, .84, .63),
                          vec3(.35, .72, 1.), vec3(.78, .49, 1.));
vec3 pal(int i) { return P[((i % 5) + 5) % 5]; }

float h21(vec2 p) { p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
mat2 rot(float a) { float c = cos(a), s = sin(a); return mat2(c, -s, s, c); }
float sdRoundBox(vec2 q, vec2 b, float r) {
  vec2 d = abs(q) - b + r;
  return length(max(d, 0.)) + min(max(d.x, d.y), 0.) - r;
}
float smin(float a, float b, float k) {
  float h = max(k - abs(a - b), 0.) / k;
  return min(a, b) - h * h * k * .25;
}

// ① 타일: fract로 화면을 칸으로 쪼개고, 칸 번호로 시차(스태거)를 줌
vec3 tiles(vec2 lp, vec2 size) {
  vec3 bg = vec3(.055, .06, .075);
  float cell = floor(min(size.x, size.y) / 7.);
  vec2 cnt = floor(size / cell);
  vec2 off = (size - cnt * cell) * .5;
  vec2 g = (lp - off) / cell;
  vec2 id = floor(g);
  if (any(lessThan(id, vec2(0))) || any(greaterThanEqual(id, cnt))) return bg;
  vec2 idt = vec2(id.x, cnt.y - 1. - id.y); // 위쪽부터 세기

  float ord;
  if (uDir == 0) ord = (idt.x + idt.y) / max(cnt.x + cnt.y - 2., 1.);
  else if (uDir == 1) { vec2 c = (cnt - 1.) * .5; ord = length(id - c) / max(length(c), 1e-3); }
  else if (uDir == 2) ord = h21(id + 1.7);
  else ord = (idt.y * cnt.x + idt.x) / max(cnt.x * cnt.y - 1., 1.);

  float e = E(prog(ord * uStagger));
  vec2 q = (fract(g) - .5) * cell;
  float hs = cell * .40, r = cell * .12;

  vec3 col = bg;
  float dOld = sdRoundBox(q, vec2(hs), r);
  col = mix(col, pal(uCycle), clamp(.5 - dOld, 0., 1.));

  float s = max(e, 0.);
  vec2 qr = rot((1. - e) * 1.5708) * q;
  float dNew = sdRoundBox(qr, vec2(hs * s), r * s);
  col = mix(col, pal(uCycle + 1), clamp(.5 - dNew, 0., 1.) * step(1e-4, s));
  return col;
}

// ② 파문: 중심까지 거리(length)로 링을 그림. 반지름만 이징, 투명도는 linear
vec3 ripple(vec2 lp, vec2 size) {
  vec2 c = size * .5;
  float d = length(lp - c);
  float R = min(size.x, size.y) * .46;
  vec3 col = vec3(.04, .05, .07) * (1. + .6 * (1. - clamp(d / R, 0., 1.)));
  for (int i = 0; i < 6; i++) {
    float p = prog(float(i) / 5. * uStagger);
    if (p <= 0. || p >= 1.) continue;
    float r = E(p) * R;
    float w = (1.5 + 5. * (1. - p)) * uPx;
    float a = (1. - p) * (1. - p);
    float dist = abs(d - r);
    col += pal(i) * (smoothstep(w, 0., dist) * 1.1 + exp(-dist / (16. * uPx)) * .18) * a;
  }
  float p0 = prog(0.);
  col += vec3(1.) * smoothstep(7. * uPx, 5. * uPx, d) * (1. - E(p0) * .85);
  return col;
}

// ③ 덩어리: 거리장(SDF) 두 개를 smin으로 말랑하게 녹여 붙임
float blobSd(vec2 uv, float x, float vel, float r) {
  float st = 1. + clamp(abs(vel) * .10, 0., .45);   // 속도만큼 늘어나고(stretch) 납작해짐(squash)
  vec2 rr = vec2(r * st, r / st);
  vec2 q = (uv - vec2(x, 0.)) / rr;
  return (length(q) - 1.) * min(rr.x, rr.y);
}
float vel(float p) {
  if (p <= 0. || p >= 1.) return 0.;
  return (E(min(p + .02, 1.)) - E(max(p - .02, 0.))) / .04;
}
vec3 blob(vec2 lp, vec2 size) {
  float m = min(size.x, size.y);
  vec2 uv = (lp - size * .5) / m;
  bool merge = (uCycle % 2) == 0;
  float p1 = prog(0.), p2 = prog(uStagger);
  float far = .3, near = .07;
  float a = merge ? far : near, b = merge ? near : far;
  float x1 = -mix(a, b, E(p1)), x2 = mix(a, b, E(p2));
  float r = .13;
  float d = smin(blobSd(uv, x1, vel(p1), r), blobSd(uv, x2, vel(p2), r), .12);

  float px = uPx / m;
  vec3 bg = vec3(.05, .055, .07) * (1. - .35 * length(uv));
  vec3 bc = mix(pal(0), pal(4), clamp(uv.y * 2. + .5, 0., 1.));
  float inner = smoothstep(0., -.07, d);
  vec3 body = bc * (.55 + .45 * inner);
  float spec = smoothstep(.045, 0., length(uv - vec2(x1 - .035, .05))) + smoothstep(.045, 0., length(uv - vec2(x2 - .035, .05)));
  body += vec3(1.) * spec * .22 * inner;
  vec3 col = bg + bc * exp(-max(d, 0.) * 22.) * .22;
  return mix(col, body, smoothstep(px, -px, d));
}

void main() {
  vec2 fc = gl_FragCoord.xy, size = uRes, lp = fc;
  float h = floor(uRes.x * .5);
  if (uCompare == 1) {
    if (fc.x >= h) { side = 1; lp.x -= h; size.x = uRes.x - h; } else size.x = h;
  }
  vec3 col = uScene == 0 ? tiles(lp, size) : uScene == 1 ? ripple(lp, size) : blob(lp, size);
  if (uCompare == 1 && abs(fc.x - h) < uPx) col = vec3(.3);
  outColor = vec4(col, 1.);
}
</script>

<script>
const $ = s => document.querySelector(s);

const PRESETS = {
  'linear': [0, 0, 1, 1],
  'ease-in': [.55, 0, 1, .45],
  'ease-out': [0, .55, .45, 1],
  'ease-in-out': [.65, 0, .35, 1],
  'back-out': [.34, 1.56, .64, 1],
  'anticipate': [.68, -.6, .32, 1.6],
  'spring': null,
};
const TIPS = [
  '<b>스태거를 배우는 장면.</b> 스태거를 0 → 0.3 → 1.5로 바꿔 보세요. 0이면 밋밋하고, 조금만 줘도 파도가 생기고, 너무 크면 지루해져요. 방향도 바꿔 보세요. back-out으로 두면 칸이 “톡” 튀어요.',
  '<b>이징의 물리감.</b> linear로 바꾸면 레이더처럼 기계적이에요. ease-out은 물에 돌을 던진 느낌이 나요. 실제 파문이 처음엔 빠르고 점점 느려지거든요. ease-in은 왜 어색한지도 느껴 보세요.',
  '<b>오버슈트와 예비동작.</b> anticipate는 붙기 전에 살짝 물러나요. spring으로 바꾸고 출렁임을 올려 보세요. 스태거를 주면 한쪽이 먼저 출발해요. 빨리 움직일 때 늘어나는 건 squash &amp; stretch예요.',
];
const HOLD = 0.6;

const st = {
  scene: 0, dur: 0.9, stagger: 0.8, dir: 0, compare: false, edit: 'A',
  playing: true, T: 0, cycle: 0,
  curves: {
    A: { name: 'back-out', mode: 'bezier', p: [...PRESETS['back-out']], bounce: .5 },
    B: { name: 'linear', mode: 'bezier', p: [...PRESETS.linear], bounce: .5 },
  },
  fn: {},
};
const cycleLen = () => st.dur + st.stagger + HOLD;

// ---------- easing ----------
function bezier([x1, y1, x2, y2]) {
  const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
  const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
  const X = s => ((ax * s + bx) * s + cx) * s;
  const Y = s => ((ay * s + by) * s + cy) * s;
  const dX = s => (3 * ax * s + 2 * bx) * s + cx;
  return t => {
    let s = t;
    for (let i = 0; i < 8; i++) {
      const e = X(s) - t, d = dX(s);
      if (Math.abs(e) < 1e-6 || Math.abs(d) < 1e-6) break;
      s -= e / d;
    }
    if (!(s >= 0 && s <= 1) || Math.abs(X(s) - t) > 1e-4) {
      let lo = 0, hi = 1; s = t;
      for (let i = 0; i < 40; i++) { if (X(s) < t) lo = s; else hi = s; s = (lo + hi) / 2; }
    }
    return Y(s);
  };
}
function spring(bounce) {
  const z = Math.max(.15, 1 - bounce * .85);          // 감쇠비: 1이면 안 출렁임
  if (z >= .999) { const w = 9; return t => 1 - Math.exp(-w * t) * (1 + w * t); }
  const w = 5.5 / z, wd = w * Math.sqrt(1 - z * z);    // 지속시간 끝에 거의 멈추도록
  return t => 1 - Math.exp(-z * w * t) * (Math.cos(wd * t) + (z * w / wd) * Math.sin(wd * t));
}
const makeFn = c => c.mode === 'spring' ? spring(c.bounce) : bezier(c.p);

// ---------- WebGL ----------
const canvas = $('#gl');
const gl = canvas.getContext('webgl2', { antialias: false });
let prog, U = {}, tex = {};
if (!gl) { $('#err').style.display = 'grid'; }
else {
  const vs = `#version 300 es
  void main(){ vec2 p = vec2((gl_VertexID << 1) & 2, gl_VertexID & 2); gl_Position = vec4(p * 2. - 1., 0., 1.); }`;
  const sh = (type, src) => {
    const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
  };
  prog = gl.createProgram();
  gl.attachShader(prog, sh(gl.VERTEX_SHADER, vs));
  gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, $('#fs').textContent));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
  gl.useProgram(prog);
  for (const n of ['uRes', 'uT', 'uDur', 'uStagger', 'uPx', 'uScene', 'uDir', 'uCycle', 'uCompare', 'uEaseA', 'uEaseB'])
    U[n] = gl.getUniformLocation(prog, n);
  for (const [k, unit] of [['A', 0], ['B', 1]]) {
    const t = gl.createTexture();
    gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, t);
    for (const p of [gl.TEXTURE_MIN_FILTER, gl.TEXTURE_MAG_FILTER]) gl.texParameteri(gl.TEXTURE_2D, p, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    tex[k] = { t, unit };
  }
  gl.uniform1i(U.uEaseA, 0); gl.uniform1i(U.uEaseB, 1);
}

function rebuild(k) {
  const fn = st.fn[k] = makeFn(st.curves[k]);
  if (!gl) return;
  const lut = new Float32Array(256);
  for (let i = 0; i < 256; i++) lut[i] = fn(i / 255);
  lut[0] = 0; lut[255] = 1;
  gl.activeTexture(gl.TEXTURE0 + tex[k].unit);
  gl.bindTexture(gl.TEXTURE_2D, tex[k].t);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.R32F, 256, 1, 0, gl.RED, gl.FLOAT, lut);
}

// ---------- curve editor ----------
const cv = $('#curve'), cx = cv.getContext('2d');
const YMIN = -0.45, YMAX = 1.45, M = 18;
let CW = 0, CH = 0;
function sizeCurve() {
  const dpr = devicePixelRatio || 1;
  CW = cv.clientWidth; CH = cv.clientHeight;
  cv.width = CW * dpr; cv.height = CH * dpr;
  cx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
const toPx = (x, y) => [M + x * (CW - 2 * M - 14), CH - M - (y - YMIN) / (YMAX - YMIN) * (CH - 2 * M)];
const fromPx = (px, py) => [(px - M) / (CW - 2 * M - 14), YMIN + (CH - M - py) / (CH - 2 * M) * (YMAX - YMIN)];
const color = k => k === 'A' ? '#ff7a59' : '#5ab8ff';

function plot(fn, stroke, width, dash) {
  cx.beginPath();
  for (let i = 0; i <= 120; i++) { const t = i / 120, [x, y] = toPx(t, fn(t)); i ? cx.lineTo(x, y) : cx.moveTo(x, y); }
  cx.setLineDash(dash || []); cx.strokeStyle = stroke; cx.lineWidth = width; cx.stroke(); cx.setLineDash([]);
}
function drawCurve() {
  cx.clearRect(0, 0, CW, CH);
  const [x0, y0] = toPx(0, 0), [x1, y1] = toPx(1, 1);
  cx.fillStyle = '#ffffff06'; cx.fillRect(x0, y1, x1 - x0, y0 - y1);
  cx.strokeStyle = '#ffffff22'; cx.lineWidth = 1; cx.strokeRect(x0, y1, x1 - x0, y0 - y1);
  cx.fillStyle = '#8b8d98'; cx.font = '10px -apple-system, sans-serif';
  cx.fillText('0', 4, y0 + 3); cx.fillText('1', 4, y1 + 3);
  cx.fillText('시간 →', x1 - 30, CH - 4); cx.fillText('위치', x1 + 1, 10);
  plot(t => t, '#ffffff18', 1, [3, 3]);

  const keys = st.compare ? ['A', 'B'] : ['A'];
  const other = st.edit === 'A' ? 'B' : 'A';
  if (st.compare) plot(st.fn[other], color(other) + '88', 1.5, [4, 3]);
  plot(st.fn[st.edit], color(st.edit), 2.5);

  const c = st.curves[st.edit];
  if (c.mode === 'bezier') {
    const [h1x, h1y] = toPx(c.p[0], c.p[1]), [h2x, h2y] = toPx(c.p[2], c.p[3]);
    cx.strokeStyle = '#ffffff66'; cx.lineWidth = 1;
    cx.beginPath(); cx.moveTo(x0, y0); cx.lineTo(h1x, h1y); cx.moveTo(x1, y1); cx.lineTo(h2x, h2y); cx.stroke();
    for (const [hx, hy] of [[h1x, h1y], [h2x, h2y]]) {
      cx.beginPath(); cx.arc(hx, hy, 6, 0, 7); cx.fillStyle = '#0b0c10'; cx.fill();
      cx.strokeStyle = color(st.edit); cx.lineWidth = 2; cx.stroke();
    }
  }

  // 첫 요소(지연 0)의 현재 위치: 커브 위 점 + 오른쪽 "실제 위치" 트랙
  const p = Math.min(Math.max(st.T / st.dur, 0), 1);
  const tx = CW - 8;
  cx.strokeStyle = '#ffffff22'; cx.lineWidth = 2;
  cx.beginPath(); cx.moveTo(tx, toPx(0, YMIN)[1]); cx.lineTo(tx, toPx(0, YMAX)[1]); cx.stroke();
  for (const k of keys) {
    const v = st.fn[k](p), [px, py] = toPx(p, v);
    cx.fillStyle = color(k);
    cx.beginPath(); cx.arc(px, py, 4, 0, 7); cx.fill();
    cx.beginPath(); cx.arc(tx, py, 5, 0, 7); cx.fill();
  }
}

let drag = -1;
cv.addEventListener('pointerdown', e => {
  const c = st.curves[st.edit];
  if (c.mode !== 'bezier') return;
  const r = cv.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
  for (const i of [0, 1]) {
    const [hx, hy] = toPx(c.p[i * 2], c.p[i * 2 + 1]);
    if (Math.hypot(mx - hx, my - hy) < 16) { drag = i; cv.setPointerCapture(e.pointerId); break; }
  }
});
cv.addEventListener('pointermove', e => {
  if (drag < 0) return;
  const r = cv.getBoundingClientRect();
  let [x, y] = fromPx(e.clientX - r.left, e.clientY - r.top);
  const c = st.curves[st.edit];
  c.p[drag * 2] = +Math.min(Math.max(x, 0), 1).toFixed(2);
  c.p[drag * 2 + 1] = +Math.min(Math.max(y, YMIN), YMAX).toFixed(2);
  c.name = 'custom';
  rebuild(st.edit); syncCurveUI();
});
cv.addEventListener('pointerup', () => drag = -1);

// ---------- UI ----------
const presetsEl = $('#presets');
for (const name of Object.keys(PRESETS)) {
  const b = document.createElement('button');
  b.textContent = name; b.dataset.name = name;
  b.onclick = () => {
    const c = st.curves[st.edit];
    c.name = name;
    if (PRESETS[name]) { c.mode = 'bezier'; c.p = [...PRESETS[name]]; } else c.mode = 'spring';
    rebuild(st.edit); syncCurveUI();
  };
  presetsEl.appendChild(b);
}

function syncCurveUI() {
  const c = st.curves[st.edit];
  document.documentElement.style.setProperty('--edit', color(st.edit));
  for (const b of presetsEl.children) b.classList.toggle('on', b.dataset.name === c.name);
  $('#code').textContent = c.mode === 'spring'
    ? `spring(출렁임 ${c.bounce.toFixed(2)})`
    : `cubic-bezier(${c.p.join(', ')})`;
  $('#bounceRow').classList.toggle('hidden', c.mode !== 'spring');
  $('#bounce').value = c.bounce; $('#bounceOut').textContent = c.bounce.toFixed(2);
  for (const b of $('#tabs').children) b.classList.toggle('on', b.dataset.k === st.edit);
}

$('#bounce').oninput = e => {
  st.curves[st.edit].bounce = +e.target.value;
  rebuild(st.edit); syncCurveUI();
};
$('#tabs').onclick = e => { if (e.target.dataset.k) { st.edit = e.target.dataset.k; syncCurveUI(); } };

$('#scenes').onclick = e => {
  const s = e.target.dataset.s; if (s === undefined) return;
  st.scene = +s;
  for (const b of $('#scenes').children) b.classList.toggle('on', b.dataset.s === s);
  $('#tip').innerHTML = TIPS[st.scene];
  $('#dirRow').classList.toggle('hidden', st.scene !== 0);
};

function bindRange(id, key) {
  const el = $('#' + id), out = $('#' + id + 'Out');
  el.value = st[key]; out.textContent = st[key].toFixed(2);
  el.oninput = () => { st[key] = +el.value; out.textContent = st[key].toFixed(2); };
}
bindRange('dur', 'dur'); bindRange('stagger', 'stagger');
$('#dir').onchange = e => st.dir = +e.target.value;
$('#compare').onchange = e => {
  st.compare = e.target.checked;
  $('#app').classList.toggle('compare', st.compare);
  if (!st.compare) st.edit = 'A';
  syncCurveUI();
};

const setPlaying = v => { st.playing = v; $('#play').textContent = v ? '⏸' : '▶'; };
$('#play').onclick = () => setPlaying(!st.playing);
addEventListener('keydown', e => { if (e.code === 'Space' && e.target.tagName !== 'INPUT') { e.preventDefault(); setPlaying(!st.playing); } });
$('#scrub').oninput = e => { setPlaying(false); st.T = +e.target.value * cycleLen(); };

// ---------- loop ----------
function resize() {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  canvas.width = Math.max(1, Math.round(canvas.clientWidth * dpr));
  canvas.height = Math.max(1, Math.round(canvas.clientHeight * dpr));
  sizeCurve();
}
new ResizeObserver(resize).observe($('#stage'));

let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, .05); last = now;
  const L = cycleLen();
  if (st.playing) {
    st.T += dt;
    if (st.T >= L) { st.T -= L; st.cycle++; }
    $('#scrub').value = st.T / L;
  }
  st.T = Math.min(st.T, L);
  $('#time').textContent = `${st.T.toFixed(2)}s / ${L.toFixed(2)}s`;

  if (gl) {
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.uniform2f(U.uRes, canvas.width, canvas.height);
    gl.uniform1f(U.uT, st.T); gl.uniform1f(U.uDur, st.dur); gl.uniform1f(U.uStagger, st.stagger);
    gl.uniform1f(U.uPx, Math.min(devicePixelRatio || 1, 2));
    gl.uniform1i(U.uScene, st.scene); gl.uniform1i(U.uDir, st.dir);
    gl.uniform1i(U.uCycle, st.cycle); gl.uniform1i(U.uCompare, st.compare ? 1 : 0);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
  drawCurve();
  requestAnimationFrame(frame);
}

rebuild('A'); rebuild('B'); syncCurveUI();
$('#tip').innerHTML = TIPS[0];
resize();
requestAnimationFrame(frame);
</script>
</body>
</html>
